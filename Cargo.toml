[package]
name = "nopepdf"
version = "0.2.0"
description = "Lightweight, fast PDF reader"
license = "MIT"
homepage = "https://nopepdf.com"
repository = "https://github.com/socherification/NopePDF"
edition = "2024"

[dependencies]
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "persistence", "clipboard", "x11", "wayland"] }
egui = "0.37"
open = "5"
pdfium-render = "0.9"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winresource = "0.1"
